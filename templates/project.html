<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{name}} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
        <nav>
          <a href="{% url 'main:show_main' %}">Profile</a>
          <a href="{% url 'main:show_experience' %}">Experience</a>
          <a href="{% url 'main:show_project' %}">Project</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="project-section" id="experience">
        <div class="container">
          <p class="section-kicker">My journey so far</p>
          <h1>Projects</h1>

          <div class="project-grid">
            {% for project in project_list %}
            <article class="project-card">
                <img
                  src="{{project.image.url}}"
                  alt="{{ project.name }}"
                  class="project-image"
                />
              <div class="project-detail">
                <h2>{{ project.name }}</h2>
                <p class="project-description">{{ project.description }}</p>
              </div>
              </article>
            {% empty %}
            <p class="empty-state">No project has been added yet.</p>
            {% endfor %}
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          &copy; 2026 {{name}}. Fakultas Ilmu Komputer, Universitas Indonesia.
        </p>
      </div>
    </footer>
  </body>
</html>
