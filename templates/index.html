<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{name}} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
        <nav>
          <a href="{% url 'main:show_main' %}">Profile</a>
          <a href="{% url 'main:show_experience' %}">Experience</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="profile">
        <div class="container hero-grid">
          <div class="hero-identity">
            <p class="hero-kicker">
              Information System &middot; Universitas Indonesia
            </p>
            <h1>Ihsan</h1>
          </div>
          <div class="hero-photo">
            <div class="photo-block"></div>
            <img
              class="avatar"
              src="/static/img/meui.jpeg"
              alt="Photo of {{name}}"
            />
          </div>
          <div class="hero-details">
            <p class="bio">C{{bio}}</p>
            <dl class="meta-list">
              <div class="meta-row">
                <dt>NPM</dt>
                <dd>{{npm}}</dd>
              </div>
              <div class="meta-row">
                <dt>Program</dt>
                <dd>{{study_program}}</dd>
              </div>
            </dl>
            <div class="social-links">
              <a href="https://github.com/8ijaan" class="social-link">GitHub</a>
              <a
                href="https://www.linkedin.com/in/ihsan-rafi-1abb5a29b/"
                class="social-link"
                >LinkedIn</a
              >
              <a href="mailto:ihsanrfi05@gmail.com" class="social-link"
                >Email</a
              >
            </div>
          </div>
        </div>
      </section>

      <section class="skills-container">
        <div>
          <h2 class="section-title">MY SKILLS</h2>

          <ul class="skill-list carousel-container">
            <li class="skill carousel-item">
              <img
                src="/static/img/css.svg"
                alt="CSS Logo"
                class="skill-logo"
              />
            </li>
            <li class="skill carousel-item">
              <img
                src="/static/img/python.svg"
                alt="Python Logo"
                class="skill-logo"
              />
            </li>
            <li class="skill carousel-item">
              <img
                src="/static/img/java.svg"
                alt="Java Logo"
                class="skill-logo"
              />
            </li>
            <li class="skill carousel-item">
              <img
                src="/static/img/react.svg"
                alt="React Logo"
                class="skill-logo"
              />
            </li>
            <li class="skill carousel-item">
              <img
                src="/static/img/js.svg"
                alt="JavaScript Logo"
                class="skill-logo"
              />
            </li>
            <li class="skill carousel-item">
              <img
                src="/static/img/html.svg"
                alt="HTML Logo"
                class="skill-logo"
              />
            </li>
            <li class="skill carousel-item">
              <img
                src="/static/img/css.svg"
                alt="CSS Logo"
                class="skill-logo"
              />
            </li>
            <li class="skill carousel-item">
              <img
                src="/static/img/python.svg"
                alt="Python Logo"
                class="skill-logo"
              />
            </li>
          </ul>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          &copy; 2026 {{name}}. Fakultas Ilmu Komputer, Universitas Indonesia.
        </p>
      </div>
    </footer>
  </body>
</html>
